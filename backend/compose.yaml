name: study-mentor-full-product-v1

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: ai_study_mentor
      POSTGRES_PASSWORD: local-development-only-password
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - ai-study-mentor-postgres-data:/var/lib/postgresql/data
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_study_mentor -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  ai-study-mentor-postgres-data:
